name: Checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly link check, Mondays 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Type check, format and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: astro check
        run: pnpm check

      - name: prettier --check
        run: pnpm format:check

      - name: Build
        run: pnpm build

  links:
    name: Link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check links in the built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --exclude '^https://(www\.)?linkedin\.com'
            --exclude '^https://nishantppanchal\.com'
            'dist/**/*.html'
          fail: true
